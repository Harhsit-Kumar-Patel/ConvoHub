version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: convohub-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: convohub
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - "27017:27017"
    networks:
      - convohub-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: convohub-seed
    restart: "no"
    command: ["node", "seed/init.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/convohub?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_key_32_chars_min}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - convohub-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: convohub-server
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/convohub?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_key_32_chars_min}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - convohub-network
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5050/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5050}
    container_name: convohub-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - convohub-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  convohub-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  uploads_data:
    driver: local
